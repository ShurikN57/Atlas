name: Atlas self-test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'export.js'
      - 'history.js'
      - 'geocode.js'
      - 'zoning.js'
      - 'heritage.js'
      - 'v14.js'
      - 'v14.css'
      - 'data/test-cases.json'
      - 'scripts/selftest.mjs'
      - '.github/workflows/atlas-selftest.yml'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Atlas address checks
        run: node scripts/selftest.mjs
